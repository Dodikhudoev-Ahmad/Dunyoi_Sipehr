<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bodoni Moda / Golos Text are self-hosted (src/main.tsx imports from @fontsource*) rather
         than loaded from Google Fonts, so there's no external font origin to preconnect to. -->
    <!-- No static <title>/<meta name="description"> here on purpose: react-helmet-async only
         manages tags it renders itself, so a static tag would sit alongside (not get replaced
         by) the per-page one — see src/lib/seo.ts DEFAULT_TITLE/DEFAULT_DESCRIPTION, rendered
         once at the app root (App.tsx) as the single source of truth every page overrides. -->
    <script>
      // Sets the `dark` class before first paint to avoid a light-theme flash.
      // Keep in sync with src/lib/theme.ts (getInitialTheme). Defaults to dark when there's no
      // stored preference, regardless of system color scheme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored !== 'light';
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <script>
      // Warms the browser's HTTP cache for the homepage hero image before React has even loaded,
      // let alone mounted HeroSection — this is a CSR app with one shared index.html for every
      // route, so a static <link rel=preload> here would fetch the hero image on every page (most
      // of which never render it); a real <link rel=preload> added via react-helmet-async instead
      // doesn't help either, since Helmet only writes to <head> after React mounts, i.e. at
      // roughly the same moment the real <img> would request it anyway. This plain `Image()` kicks
      // the fetch off immediately, but only when the path is actually a homepage route, so other
      // pages pay nothing. Keep the URL in sync with HeroSection.tsx's
      // `optimizeImageUrl(editorialImages.hero, 1600)` call — a mismatch just means a wasted
      // preload, not a broken page, since HeroSection's own <img> still sets its real src either way.
      (function () {
        var homePaths = ['/', '/en', '/tg'];
        if (homePaths.indexOf(location.pathname) === -1) return;
        try {
          var img = new Image();
          if ('fetchPriority' in img) img.fetchPriority = 'high';
          img.src = 'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1600&q=75&auto=format&fit=crop';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
