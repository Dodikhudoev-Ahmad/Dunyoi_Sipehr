<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bodoni Moda / Golos Text are self-hosted (src/main.tsx imports from @fontsource*) rather
         than loaded from Google Fonts, so there's no external font origin to preconnect to. -->
    <!-- No static <title>/<meta name="description"> here on purpose: react-helmet-async only
         manages tags it renders itself, so a static tag would sit alongside (not get replaced
         by) the per-page one — see src/lib/seo.ts DEFAULT_TITLE/DEFAULT_DESCRIPTION, rendered
         once at the app root (App.tsx) as the single source of truth every page overrides. -->
    <script>
      // Sets the `dark` class before first paint to avoid a light-theme flash.
      // Keep in sync with src/lib/theme.ts (getInitialTheme). Defaults to dark when there's no
      // stored preference, regardless of system color scheme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored !== 'light';
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
